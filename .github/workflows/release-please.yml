name: Release Please
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please-master
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Unlike GITHUB_TOKEN, a dedicated token lets Release PRs trigger normal CI.
      - name: Check Release Please credential
        env:
          RELEASE_TOKEN: ${{ secrets.AUTOFIX_PAT }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Configure AUTOFIX_PAT with repository contents, pull requests and issues write access so Release PRs trigger CI.'
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        id: release
        with:
          token: ${{ secrets.AUTOFIX_PAT }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Test all declared frameworks
        run: dotnet test tests/UnitTests/OoplesFinance.YahooFinanceAPI.Tests.Unit.csproj -c Release -p:GeneratePackageOnBuild=false
      - name: Pack all declared frameworks
        run: dotnet pack src/OoplesFinance.YahooFinanceAPI.csproj -c Release --no-build -o out -p:GeneratePackageOnBuild=false
      - name: Verify package version and target frameworks
        run: python .github/scripts/verify-release-package.py out "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: release-packages
          path: out/*.*nupkg
          if-no-files-found: error
  publish:
    needs: [release-please, build-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: out
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish verified packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo '::error::NUGET_API_KEY is unavailable.'
            exit 1
          fi
          dotnet nuget push 'out/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
